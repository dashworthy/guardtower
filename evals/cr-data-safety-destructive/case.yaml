schema_version: "1.1"
name: cr-data-safety-destructive
description: guardtower must catch a destructive/irreversible data operation — an unguarded bulk DELETE that can wipe far more than intended.
tags: [guardtower, data-safety, python]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Write, Edit]
  prompt: |
    This repo has an uncommitted change adding a stale-session cleanup routine
    (CHANGE.diff; changed files under src/). Please run a medium-effort (guardtower)
    review of the change before I commit it. Report what you find; don't change
    any code.
context:
  scaffold_script: scaffold.sh
