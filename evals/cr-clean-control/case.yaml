schema_version: "1.1"
name: cr-clean-control
description: A genuinely clean change — guardtower should report no material defect and not manufacture a false positive.
tags: [guardtower, false-positive, php]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Write, Edit, AskUserQuestion]
  prompt: |
    This repo has an uncommitted change adding a book-count method plus a
    test (CHANGE.diff; changed files under src/ and tests/). Please run a
    medium-effort (guardtower) review of the change before I commit it. Report what
    you find — don't change any code.
context:
  scaffold_script: scaffold.sh
