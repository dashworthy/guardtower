schema_version: "1.1"
name: cr-late-facet-big-diff
description: On a multi-file change above the inline threshold, guardtower dispatches exactly one reviewer agent and still catches an N+1 query planted in a late facet (technical).
tags: [guardtower, efficiency, single-reviewer, python]
runs: 3
execution:
  max_turns: 60
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Write, Edit]
  prompt: |
    This repo has an uncommitted change adding an order-export feature across
    several modules (CHANGE.diff; changed files under src/ and tests/). Please run
    a medium-effort (guardtower) review of the change before I commit it. Report
    what you find — don't change any code.
context:
  scaffold_script: scaffold.sh
