schema_version: "1.1"
name: cr-security-sqli
description: A deep guardtower must catch a SQL injection introduced by the change under review (PHP).
tags: [guardtower, security, php]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Write, Edit]
  prompt: |
    This repo has an uncommitted change adding a user-name search to the
    repository layer. The change is captured in CHANGE.diff, and the changed
    files are under src/. Please run a thorough (guardtower) review of this
    change before I commit it. Report what you find — don't change any code.
context:
  scaffold_script: scaffold.sh
