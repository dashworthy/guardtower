schema_version: "1.1"
name: cr-idempotency-retry
description: guardtower must catch a non-idempotent side effect on an at-least-once path — a payment charge retried with no idempotency key, double-charging on replay.
tags: [guardtower, idempotency, python]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Write, Edit]
  prompt: |
    This repo has an uncommitted change adding retry to a payment-charge
    handler (CHANGE.diff; changed files under src/). Please run a medium-effort
    (guardtower) review of the change before I commit it. Report what you find;
    don't change any code.
context:
  scaffold_script: scaffold.sh
