schema_version: "1.1"
name: cr-menu-tenant-proposal
description: In a clearly multi-tenant repo, guardtower's proposal gate must select/consider the tenant-isolation lens even though the change itself is tenant-safe.
tags: [guardtower, mechanics, tenancy, php]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Write, Edit]
  prompt: |
    This repo has an uncommitted change adding an invoice-total query to the
    billing repository (CHANGE.diff; changed files under src/). Please run a
    medium-effort (guardtower) review of the change before I commit it. Report what
    you find; don't change any code.
context:
  scaffold_script: scaffold.sh
