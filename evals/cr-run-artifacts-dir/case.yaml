schema_version: "1.1"
name: cr-run-artifacts-dir
description: Every artifact a guardtower run writes lands in .guardtower/{date}-{run-name}/{artifact}.md — the report is report.md in a dated, named run directory, and nothing is written elsewhere.
tags: [guardtower, mechanics, artifacts, php]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Write, Edit, AskUserQuestion]
  prompt: |
    This repo has an uncommitted change adding a user-name search to the
    repository layer (CHANGE.diff; changed files under src/). Please run a
    medium-effort (guardtower) review of this change before I commit it.
    Report what you find; don't change any code.
context:
  scaffold_script: scaffold.sh
