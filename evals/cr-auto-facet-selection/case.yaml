schema_version: "1.1"
name: cr-auto-facet-selection
description: guardtower selects the facets itself from what the change does — here data-safety, API, and idempotency on top of the core set — and runs them without asking the human to pick.
tags: [guardtower, mechanics, facet-selection, python]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Write, Edit, AskUserQuestion]
  prompt: |
    This repo has an uncommitted change adding a carrier-notification queue
    handler and a schema migration (CHANGE.diff; changed files under src/ and
    migrations/). Please run a medium-effort (guardtower) review of the change
    before I commit it. Report what you find; don't change any code.
context:
  scaffold_script: scaffold.sh
