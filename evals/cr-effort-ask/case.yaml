schema_version: "1.1"
name: cr-effort-ask
description: With no effort level given, guardtower must ask for one through the question tool — four levels as structured options, the recommended one first — instead of silently defaulting.
tags: [guardtower, mechanics, effort, questions, php]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Write, Edit, AskUserQuestion]
  prompt: |
    This repo has an uncommitted change adding a user-name search to the
    repository layer (CHANGE.diff; changed files under src/). Please run a
    guardtower review of this change before I commit it. Report what you
    find; don't change any code.
context:
  scaffold_script: scaffold.sh
