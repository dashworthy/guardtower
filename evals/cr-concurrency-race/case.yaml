schema_version: "1.1"
name: cr-concurrency-race
description: guardtower should catch a check-then-act (TOCTOU) race in bookIfFree — two concurrent callers can both pass the overlap check and double-book a room.
tags: [guardtower, concurrency, php]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Write, Edit]
  prompt: |
    This repo has an uncommitted change adding room-booking logic to the
    scheduler (CHANGE.diff; changed files under src/). Please run a medium-effort
    (guardtower) review of the change before I commit it. Report what you
    find — don't change any code.
context:
  scaffold_script: scaffold.sh
