schema_version: "1.1"
name: cr-reuse-reinvent
description: guardtower should notice a new SMS client hand-rolls its own backoff instead of reusing the repo's shared BackoffRetry helper (needs codebase awareness).
tags: [guardtower, reuse, php]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Write, Edit]
  prompt: |
    This repo has an uncommitted change adding a new SMS client (CHANGE.diff;
    changed files under src/). Please run a thorough (guardtower) review of the
    change before I commit it. Report what you find — don't change any code.
context:
  scaffold_script: scaffold.sh
