schema_version: "1.1"
name: cr-efficiency-nplus1
description: guardtower should catch an N+1 query pattern — book_summaries now calls _load_book (two DB queries) once per book id instead of batching.
tags: [guardtower, efficiency, python]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Write, Edit]
  prompt: |
    This repo has an uncommitted change reworking how book summaries are loaded
    (CHANGE.diff; changed files under src/). Please run a thorough (guardtower)
    review of the change before I commit it. Report what you find — don't change
    any code.
context:
  scaffold_script: scaffold.sh
