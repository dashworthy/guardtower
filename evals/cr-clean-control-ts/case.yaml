schema_version: "1.1"
name: cr-clean-control-ts
description: A second clean control in a different stack (TypeScript) — guardtower must report the change clean and manufacture no false positive.
tags: [guardtower, false-positive, typescript]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Write, Edit]
  prompt: |
    This repo has an uncommitted change adding a slugify helper plus a test
    (CHANGE.diff; changed files under src/ and test/). Please run a thorough
    (guardtower) review of the change before I commit it. Report what you find;
    don't change any code.
context:
  scaffold_script: scaffold.sh
