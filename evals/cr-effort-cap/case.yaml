schema_version: "1.1"
name: cr-effort-cap
description: At low effort, guardtower must bound findings to the per-facet cap and honestly report that more were held back (dropped), rather than dumping every defect.
tags: [guardtower, mechanics, effort, php]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Write, Edit, AskUserQuestion]
  prompt: |
    This repo has an uncommitted change adding several admin search helpers to
    the repository layer (CHANGE.diff; changed files under src/). Please run a
    LOW-effort (guardtower) review of this change before I commit it — I want
    only the strongest findings. Report what you find; don't change any code.
context:
  scaffold_script: scaffold.sh
