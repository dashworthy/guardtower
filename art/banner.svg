<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="guardtower — in-depth, opt-in code review across selectable facets">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.5"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <pattern id="merlon" width="44" height="12" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="24" height="12"/>
    </pattern>
    <radialGradient id="beacon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style>
  </defs>

  <rect width="1200" height="400" fill="#0B1120"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- side watchtowers (skyline, dim) -->
  <g fill="url(#wall)">
    <rect x="126" y="308" width="48" height="68"/>
    <rect x="126" y="298" width="12" height="12"/><rect x="144" y="298" width="12" height="12"/><rect x="162" y="298" width="12" height="12"/>
    <rect x="336" y="322" width="42" height="54"/>
    <rect x="336" y="312" width="11" height="12"/><rect x="352" y="312" width="11" height="12"/><rect x="367" y="312" width="11" height="12"/>
  </g>

  <!-- central lit tower behind the wordmark tail -->
  <circle cx="600" cy="150" r="40" fill="url(#beacon)"/>
  <g fill="url(#accent)">
    <rect x="576" y="190" width="48" height="186"/>
    <rect x="568" y="178" width="16" height="12"/><rect x="592" y="178" width="16" height="12"/><rect x="616" y="178" width="16" height="12"/>
  </g>
  <rect x="592" y="230" width="16" height="26" rx="2" fill="#0B1120"/>
  <circle cx="600" cy="150" r="7" fill="#6EE7B7"/>

  <!-- battlement wall along the bottom -->
  <g fill="url(#wall)">
    <rect x="0" y="376" width="1200" height="24"/>
    <rect x="0" y="366" width="1200" height="12" fill="url(#merlon)"/>
  </g>

  <!-- wordmark -->
  <text x="72" y="235" font-size="100" font-weight="800" letter-spacing="-0.04em" fill="url(#accent)">guardtower</text>
  <text x="76" y="276" font-size="22" font-weight="400" fill="#94A3B8">In-depth, opt-in code review across selectable facets</text>

  <!-- crafted-by mark -->
  <text x="1180" y="332" text-anchor="end" font-size="9" font-weight="800" font-style="italic" letter-spacing="0.02em" fill="#94A3B8">CRAFTED BY</text>
  <text x="1180" y="352" text-anchor="end" font-size="20" font-weight="900" font-style="italic" letter-spacing="-0.07em"><tspan fill="#F1F5F9">DASH</tspan><tspan fill="#CBD5E1">WORTHY</tspan></text>
</svg>
